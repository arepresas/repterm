name: Bug report
description: Report something that is not working in repterm
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        of the form as you can — reproduction steps and environment details are
        the most useful parts.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Keep it to one or two sentences.
      placeholder: Switching tabs sometimes leaves the previous tab's PTY rendering on screen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh `cargo run`.
      placeholder: |
        1. Start repterm with `SHELL=/bin/zsh cargo run`
        2. Open three tabs with `Ctrl+T`
        3. Switch back and forth with `Ctrl+PageUp` / `Ctrl+PageDown`
        4. See stale output from the previous tab
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error text verbatim.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of repterm is affected?
      options:
        - Tabs / PTY
        - Git and GitHub status bar
        - AI chat / LiteLLM
        - Clipboard (OSC 52)
        - Shell setup
        - Build / install
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Host terminal emulator
      description: The terminal you launched repterm from, and its version.
      placeholder: Ghostty 1.2.0 / Kitty 0.40 / iTerm2 3.5
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: repterm version or commit
      description: Output of `git rev-parse --short HEAD` on your checkout.
      placeholder: a1b2c3d
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: Shell
      description: Value of `$SHELL`, plus Oh My Zsh / plugin setup if relevant.
      placeholder: /bin/zsh with Oh My Zsh, zsh-autosuggestions, zsh-syntax-highlighting

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output or attach screenshots. Logs are rendered as code.
      render: shell

  - type: checkboxes
    id: latest
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest `main`
          required: false
