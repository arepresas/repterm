[package]
name = "repterm"
version = "0.1.1"
edition = "2021"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26"
arboard = "3"
eframe = "0.37"
egui = "0.37"
egui_term = "0.1.0"
env_logger = "0.11"
log = "0.4"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }

[patch.crates-io]
egui_term = { path = "vendor/egui_term" }
